<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050912" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
    <link rel="stylesheet" href="assets/css/painel.css" />
    <title>Painel | PKG GAMES</title>
  </head>
  <body>
    <main id="login-view" class="login-wrap" hidden>
      <form id="login-form" class="login-card" autocomplete="off" novalidate>
        <div class="logo">
          <i class="bx bxs-joystick logo-ico" aria-hidden="true"></i><span>PKG <b>GAMES</b></span>
        </div>
        <p class="login-sub">Painel administrativo</p>
        <label class="field"
          ><span>Usuário</span>
          <input id="login-user" type="text" autocomplete="username" autocapitalize="none" required
        /></label>
        <label class="field"
          ><span>Senha</span> <input id="login-pass" type="password" autocomplete="current-password" required
        /></label>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" type="submit"><i class="bx bx-log-in"></i>ENTRAR</button>
      </form>
    </main>

    <div id="app-view" class="app" hidden>
      <header class="topbar">
        <div class="logo">
          <i class="bx bxs-joystick logo-ico" aria-hidden="true"></i><span>PKG <b>GAMES</b></span
          ><em class="tag">PAINEL</em>
        </div>
        <button class="btn btn-ghost btn-icon" id="btn-logout" type="button" title="Sair" aria-label="Sair">
          <i class="bx bx-log-out"></i>
        </button>
      </header>

      <section class="toolbar">
        <label class="search">
          <input
            id="search"
            type="search"
            placeholder="Pesquisar jogos..."
            autocomplete="off"
            aria-label="Pesquisar jogos"
          />
          <i class="bx bx-search"></i>
        </label>
        <div class="toolbar-actions">
          <button class="btn btn-primary" id="btn-new" type="button"><i class="bx bx-plus"></i>PUBLICAR NOVO JOGO</button>
          <button class="btn btn-ghost" id="btn-export" type="button" title="Exportar catalogo.js">
            <i class="bx bx-download"></i>EXPORTAR
          </button>
          <button class="btn btn-ghost" id="btn-discard" type="button" title="Descartar rascunho" disabled>
            <i class="bx bx-reset"></i>DESCARTAR
          </button>
        </div>
      </section>

      <main class="panel">
        <div class="panel-head">
          <h2><i class="bx bxs-joystick logo-ico" aria-hidden="true"></i><span>TODOS</span> <b>GAMES</b></h2>
          <span id="count" class="count">0 jogos</span>
        </div>
        <p id="draft-note" class="draft-note" role="status" hidden>
          Rascunho local com alterações ainda não publicadas no site. Exporte o catálogo e substitua
          pkg-game/assets/js/catalogo.js; depois descarte o rascunho.
        </p>
        <div id="state" class="state" hidden></div>
        <div id="list" class="game-list" aria-live="polite"></div>
      </main>
    </div>

    <div id="modal-form" class="modal" role="dialog" aria-modal="true" aria-labelledby="form-title" hidden>
      <div class="modal-box">
        <header class="modal-head">
          <h2 id="form-title">Publicar novo jogo</h2>
          <button class="btn-x" type="button" data-close aria-label="Fechar"><i class="bx bx-x"></i></button>
        </header>
        <form id="game-form" class="modal-body" novalidate>
          <label class="field"
            ><span>Título</span>
            <input name="titulo" type="text" maxlength="200" autocomplete="off" required />
            <em class="err" data-err="titulo"></em
          ></label>

          <div class="row-2">
            <label class="field"
              ><span>Idioma</span
              ><input name="idioma" type="text" maxlength="50" autocomplete="off" placeholder="PT-BR" required /><em
                class="err"
                data-err="idioma"
              ></em
            ></label>
            <label class="field"
              ><span>Tamanho</span
              ><input name="tamanho" type="text" maxlength="50" autocomplete="off" placeholder="4.5 GB" required /><em
                class="err"
                data-err="tamanho"
              ></em
            ></label>
          </div>
          <div class="row-2">
            <label class="field"
              ><span>Formato</span
              ><input name="formato" type="text" maxlength="50" autocomplete="off" placeholder="PKG" required /><em
                class="err"
                data-err="formato"
              ></em
            ></label>
            <label class="field"
              ><span>Ano</span
              ><input name="ano" type="text" maxlength="50" autocomplete="off" placeholder="2024" required /><em
                class="err"
                data-err="ano"
              ></em
            ></label>
          </div>

          <label class="field"
            ><span>Capa <small>(URL da imagem)</small></span>
            <input name="capa" type="url" inputmode="url" autocomplete="off" placeholder="https://..." required />
            <em class="err" data-err="capa"></em
          ></label>

          <label class="field"
            ><span>Banner <small>(URL da imagem)</small></span>
            <input name="banner" type="url" inputmode="url" autocomplete="off" placeholder="https://..." required />
            <em class="err" data-err="banner"></em
          ></label>

          <label class="field"
            ><span>URL-download</span>
            <input
              name="url-download"
              type="url"
              inputmode="url"
              autocomplete="off"
              placeholder="https://..."
              required />
            <em class="err" data-err="url-download"></em
          ></label>

          <label class="field"
            ><span>Publicar banner?</span>
            <select name="publicar-banner">
              <option value="Sim">Sim</option>
              <option value="Não">Não</option>
            </select>
            <em class="err" data-err="publicar-banner"></em
          ></label>

          <p id="form-error" class="form-error" role="alert" hidden></p>
          <footer class="modal-foot">
            <button class="btn btn-ghost" type="button" data-close>CANCELAR</button>
            <button class="btn btn-primary" id="btn-save" type="submit">
              <i class="bx bx-save"></i><span>SALVAR</span>
            </button>
          </footer>
        </form>
      </div>
    </div>

    <div
      id="modal-confirm"
      class="modal modal-sm"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
      hidden
    >
      <div class="modal-box">
        <header class="modal-head"><h2 id="confirm-title">Confirmar</h2></header>
        <div class="modal-body">
          <p id="confirm-msg"></p>
          <footer class="modal-foot">
            <button class="btn btn-ghost" type="button" id="confirm-no">CANCELAR</button>
            <button class="btn btn-danger" type="button" id="confirm-yes">CONFIRMAR</button>
          </footer>
        </div>
      </div>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="../pkg-game/assets/js/catalogo.js"></script>
    <script src="assets/js/painel.js"></script>
  </body>
</html>
